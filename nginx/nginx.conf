# Desafio HTTP Basic só para clientes SIG (QGIS etc.). Tiles pedidos pelo
# navegador (<img>, Sec-Fetch-Dest: image) não recebem o desafio — senão o
# navegador abriria uma janela de login a cada tile quando a sessão expira.
map $http_sec_fetch_dest $ogc_desafio_basic {
    image   "";
    default 'Basic realm="SISCOORD-DC OGC", charset="UTF-8"';
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/siscoord.crt;
    ssl_certificate_key /etc/nginx/certs/siscoord.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # GeoServer publica WMS 1.3.0 / WFS 2.0.0 (RF-11) direto do PostGIS.
    # Regras de acesso (RNF-09): toda requisição passa antes pela API, que só
    # libera usuário autenticado e ativo (cookie de sessão do mapa, Bearer ou
    # HTTP Basic). Ver backend/app/auth/acesso_ogc.py.
    location /geoserver/ {
        auth_request /_verificar_acesso_ogc;
        error_page 401 = @ogc_nao_autenticado;

        proxy_pass http://geoserver:8080/geoserver/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # As credenciais são do SISCOORD-DC, não do GeoServer: repassá-las faria
        # o GeoServer tentar autenticá-las no próprio cadastro e recusar.
        proxy_set_header Authorization "";
    }

    location = /_verificar_acesso_ogc {
        internal;
        proxy_pass http://backend:8000/api/auth/verificar-ogc;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location @ogc_nao_autenticado {
        add_header WWW-Authenticate $ogc_desafio_basic always;
        default_type text/plain;
        charset utf-8;
        return 401 "Acesso negado: faça login no SISCOORD-DC ou informe e-mail e senha de um usuário ativo no seu cliente SIG.\n";
    }
}
