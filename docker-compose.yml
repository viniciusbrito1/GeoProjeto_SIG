services:
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://siscoord_app:${APP_DB_PASSWORD}@postgis:5432/${POSTGRES_DB}
      DATABASE_URL_MIGRACAO: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgis:5432/${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_NOME: ${ADMIN_NOME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_SENHA: ${ADMIN_SENHA}
      CORS_ORIGINS: '["https://localhost","http://localhost:8081"]'
    # RNF-06: a API só é publicada no loopback do host (para diagnóstico local).
    # Qualquer acesso pela rede passa pelo `proxy`, com TLS.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  geoserver:
    image: kartoza/geoserver:2.25.2
    restart: unless-stopped
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      INITIAL_MEMORY: 512M
      MAXIMUM_MEMORY: 1G
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
    # RNF-06 / RNF-09: porta direta só no loopback, para o console de
    # administração. WMS/WFS pela rede passam pelo `proxy` (TLS + login).
    ports:
      - "127.0.0.1:${GEOSERVER_PORTA_HOST:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/geoserver/web/ > /dev/null || wget -qO- http://localhost:8080/geoserver/web/ > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  geoserver-init:
    image: curlimages/curl:8.10.1
    depends_on:
      geoserver:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      DB_HOST: postgis
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - ./geoserver/init_geoserver.sh:/init_geoserver.sh:ro
    entrypoint: ["/bin/sh", "/init_geoserver.sh"]
    restart: "no"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - geoserver
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgis_data:
  geoserver_data:
